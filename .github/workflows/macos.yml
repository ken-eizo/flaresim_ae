name: macOS build

on:
  push:
    branches: [main, dev/nuke-original-parity]
    paths:
      - '.github/workflows/macos.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'scripts/embed_lenses_mac.py'
      - 'scripts/package_release.py'
      - 'scripts/RELEASE_INSTALL.txt'
      - 'README.md'
      - 'INSTALL.md'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'upstream/LICENSE'
      - 'upstream/src/**'
      - 'upstream/lenses/lens_files/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: macOS CPU optical core
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable CPU tests (no proprietary SDK required)
        run: cmake -S . -B build-macos-core -DCMAKE_BUILD_TYPE=Release -DFLARELENS_BUILD_AE=OFF -DFLARELENS_ENABLE_CUDA=OFF
      - name: Compile portable optical core
        run: cmake --build build-macos-core --parallel 3
      - name: Run portable tests
        run: ctest --test-dir build-macos-core --output-on-failure --parallel 3

  ae-plugin:
    name: Mac AE + Metal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    # SDK is restored from encrypted Actions secrets; no proprietary SDK
    # content is committed or published in CI artifacts.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AE_SDK_CHUNK_00: ${{ secrets.AE_SDK_MAC_00 }}
      AE_SDK_CHUNK_01: ${{ secrets.AE_SDK_MAC_01 }}
      AE_SDK_CHUNK_02: ${{ secrets.AE_SDK_MAC_02 }}
      AE_SDK_CHUNK_03: ${{ secrets.AE_SDK_MAC_03 }}
      AE_SDK_CHUNK_04: ${{ secrets.AE_SDK_MAC_04 }}
      AE_SDK_CHUNK_05: ${{ secrets.AE_SDK_MAC_05 }}
      AE_SDK_CHUNK_06: ${{ secrets.AE_SDK_MAC_06 }}
      AE_SDK_CHUNK_07: ${{ secrets.AE_SDK_MAC_07 }}
      AE_SDK_CHUNK_08: ${{ secrets.AE_SDK_MAC_08 }}
      AE_SDK_CHUNK_09: ${{ secrets.AE_SDK_MAC_09 }}
      AE_SDK_CHUNK_10: ${{ secrets.AE_SDK_MAC_10 }}
      AE_SDK_CHUNK_11: ${{ secrets.AE_SDK_MAC_11 }}
      AE_SDK_CHUNK_12: ${{ secrets.AE_SDK_MAC_12 }}
      AE_SDK_CHUNK_13: ${{ secrets.AE_SDK_MAC_13 }}
      AE_SDK_CHUNK_14: ${{ secrets.AE_SDK_MAC_14 }}
      AE_SDK_CHUNK_15: ${{ secrets.AE_SDK_MAC_15 }}
      AE_SDK_CHUNK_16: ${{ secrets.AE_SDK_MAC_16 }}
      AE_SDK_CHUNK_17: ${{ secrets.AE_SDK_MAC_17 }}
      AE_SDK_CHUNK_18: ${{ secrets.AE_SDK_MAC_18 }}
      AE_SDK_CHUNK_19: ${{ secrets.AE_SDK_MAC_19 }}
      AE_SDK_CHUNK_20: ${{ secrets.AE_SDK_MAC_20 }}
      AE_SDK_CHUNK_21: ${{ secrets.AE_SDK_MAC_21 }}
      AE_SDK_CHUNK_22: ${{ secrets.AE_SDK_MAC_22 }}
      AE_SDK_CHUNK_23: ${{ secrets.AE_SDK_MAC_23 }}
      AE_SDK_MANIFEST: ${{ secrets.AE_SDK_MAC_MANIFEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Record actual OS, CPU and Metal support
        shell: bash
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          system_profiler SPDisplaysDataType | head -100
          xcrun --find metal
      - name: Restore private Adobe SDK (encrypted Actions secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions_sdk_private.py restore --destination "$RUNNER_TEMP/private-sdk"
          test -f "$RUNNER_TEMP/private-sdk/Examples/Headers/AE_Effect.h"
          test -f "$RUNNER_TEMP/private-sdk/Examples/Util/AEFX_SuiteHelper.c"
          echo "AE_SDK_ROOT=$RUNNER_TEMP/private-sdk/Examples" >> "$GITHUB_ENV"
      - name: Configure universal macOS AE effect
        run: |
          cmake -S . -B build-macos-ae -G Ninja -DCMAKE_BUILD_TYPE=Release             -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"             -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0             -DAE_SDK_ROOT="$AE_SDK_ROOT"             -DFLARELENS_BUILD_AE=ON -DFLARELENS_ENABLE_CUDA=OFF
      - name: Compile Metal-enabled FlareSimAE.plugin
        run: cmake --build build-macos-ae --target FlareLensAE --parallel 3
      - name: Run native Metal GPU physics and parity tests
        shell: bash
        run: |
          cmake --build build-macos-ae --target FlareLensMetalGpuTest --parallel 3
          set -o pipefail
          ctest --test-dir build-macos-ae -R FlareLensMetalGpuTest --output-on-failure --verbose | tee "$RUNNER_TEMP/metal-test.log"
          # Hosted macOS 14 sometimes exposes no Metal device despite running
          # on Apple Silicon. Keep its build/bundle/ABI coverage, but explicitly
          # label that leg BUILD ONLY; never count a CTest skip as GPU success.
          if grep -q 'Metal GPU unavailable' "$RUNNER_TEMP/metal-test.log"; then
            if [[ "${{ matrix.os }}" == "macos-14" ]]; then
              echo "::notice::macOS 14 hosted runner has no accessible Metal GPU. ABI/bundle validation only; GPU runtime is NOT VERIFIED here."
            else
              echo "::error::No actual Metal GPU test on required runner"
              exit 1
            fi
          else
            grep -q 'METAL_RESOURCE_BOUNDS_AND_DEVICE_ISOLATION_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_BLANK_INPUT_SOURCE_WORLD_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_MINIMAL_SCRATCH_ALLOCATIONS_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_FHD_REFERENCE_EMISSION_SCALE_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_ORIGINAL_NUKE_UNMODIFIED_PARITY_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_TRANSPARENT_COMPOSITE_NOT_BLACK_PASSED' "$RUNNER_TEMP/metal-test.log"
            grep -q 'METAL_4_THREAD_12_FRAME_MFR_PARITY_PASSED' "$RUNNER_TEMP/metal-test.log"
          fi
      - name: Check native bundle and architectures
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find build-macos-ae -name 'FlareSimAE.plugin' -type d -print -quit)"
          test -n "$plugin" || { echo "::error::No plugin bundle generated"; exit 1; }
          binary="$plugin/Contents/MacOS/FlareSimAE"
          test -f "$binary"
          file "$binary"
          vtool -show-build "$binary"
          vtool -show-build "$binary" | grep -q 'minos 11.0'
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *" arm64 "* ]] || { echo "::error::Missing arm64 slice"; exit 1; }
          [[ " $archs " == *" x86_64 "* ]] || { echo "::error::Missing x86_64 slice"; exit 1; }
          python3 scripts/verify_mac_ae_bundle.py "$plugin"
          nm -gU "$binary" | grep -E '[[:space:]]_EffectMain$'
          test -s "$plugin/Contents/Resources/FlareLensMetal.metallib"
          # Rez may attach a resource fork to the bundle. Remove only Finder
          # metadata/extended attributes before ad-hoc signing; keep .rsrc.
          xattr -cr "$plugin"
          codesign --force --deep --sign - "$plugin"
          codesign --verify --deep --strict --verbose=2 "$plugin"
          zip="$RUNNER_TEMP/FlareSimAE_v1.0.5_macOS.zip"
          python3 scripts/package_release.py --platform macOS --version v1.0.5 --binary "$plugin" --output "$zip"
          echo "FLARE_MAC_ZIP=$zip" >> "$GITHUB_ENV"
          # Recheck the actual user download, not only the build directory.
          unpacked="$(mktemp -d)"
          ditto -x -k "$zip" "$unpacked"
          python3 scripts/verify_mac_ae_bundle.py "$unpacked/FlareSimAE.plugin"
          codesign --verify --deep --strict --verbose=2 "$unpacked/FlareSimAE.plugin"
          # The ordinary GPU fixture uses the generated development metallib.
          # Also run the EXACT packaged Metal library from the extracted user
          # download. A bundle with a missing/incompatible shader can otherwise
          # pass all pre-package tests and show a black AE frame.
          if [[ "${{ matrix.os }}" != "macos-14" ]]; then
            FLARELENS_METAL_LIBRARY="$unpacked/FlareSimAE.plugin/Contents/Resources/FlareLensMetal.metallib" \
              "$PWD/build-macos-ae/FlareLensMetalGpuTest" | tee "$RUNNER_TEMP/shipped-metal-test.log"
            grep -q 'METAL_TRANSPARENT_COMPOSITE_NOT_BLACK_PASSED' "$RUNNER_TEMP/shipped-metal-test.log"
            grep -q 'METAL_FHD_REFERENCE_EMISSION_SCALE_PASSED' "$RUNNER_TEMP/shipped-metal-test.log"
            grep -q 'METAL_ORIGINAL_NUKE_UNMODIFIED_PARITY_PASSED' "$RUNNER_TEMP/shipped-metal-test.log"
            grep -q 'METAL_4_THREAD_12_FRAME_MFR_PARITY_PASSED' "$RUNNER_TEMP/shipped-metal-test.log"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FlareSimAE-macOS-development-${{ matrix.os }}
          path: ${{ env.FLARE_MAC_ZIP }}
          if-no-files-found: error
          retention-days: 14

# Deliberately no automatic GitHub Release publication on main pushes.
# Release only after both Windows and macOS ZIPs are built from the same
# source commit, tested, and attached to one draft release. Never clobber
# an existing published version's assets.
