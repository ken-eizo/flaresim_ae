name: macOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'scripts/embed_lenses_mac.py'
      - 'upstream/src/**'
      - 'upstream/lenses/lens_files/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: macOS CPU optical core
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable CPU tests (no proprietary SDK required)
        run: cmake -S . -B build-macos-core -DCMAKE_BUILD_TYPE=Release -DFLARELENS_BUILD_AE=OFF -DFLARELENS_ENABLE_CUDA=OFF
      - name: Compile portable optical core
        run: cmake --build build-macos-core --parallel 3
      - name: Run portable tests
        run: ctest --test-dir build-macos-core --output-on-failure --parallel 3

  ae-plugin:
    name: macOS native AE plugin (CPU)
    # SDK is restored from encrypted Actions secrets; no proprietary SDK
    # content is committed or published in CI artifacts.
    runs-on: macos-15
    timeout-minutes: 50
    env:
      AE_SDK_CHUNK_00: ${{ secrets.AE_SDK_MAC_00 }}
      AE_SDK_CHUNK_01: ${{ secrets.AE_SDK_MAC_01 }}
      AE_SDK_CHUNK_02: ${{ secrets.AE_SDK_MAC_02 }}
      AE_SDK_CHUNK_03: ${{ secrets.AE_SDK_MAC_03 }}
      AE_SDK_CHUNK_04: ${{ secrets.AE_SDK_MAC_04 }}
      AE_SDK_CHUNK_05: ${{ secrets.AE_SDK_MAC_05 }}
      AE_SDK_CHUNK_06: ${{ secrets.AE_SDK_MAC_06 }}
      AE_SDK_CHUNK_07: ${{ secrets.AE_SDK_MAC_07 }}
      AE_SDK_CHUNK_08: ${{ secrets.AE_SDK_MAC_08 }}
      AE_SDK_CHUNK_09: ${{ secrets.AE_SDK_MAC_09 }}
      AE_SDK_CHUNK_10: ${{ secrets.AE_SDK_MAC_10 }}
      AE_SDK_CHUNK_11: ${{ secrets.AE_SDK_MAC_11 }}
      AE_SDK_CHUNK_12: ${{ secrets.AE_SDK_MAC_12 }}
      AE_SDK_CHUNK_13: ${{ secrets.AE_SDK_MAC_13 }}
      AE_SDK_CHUNK_14: ${{ secrets.AE_SDK_MAC_14 }}
      AE_SDK_CHUNK_15: ${{ secrets.AE_SDK_MAC_15 }}
      AE_SDK_CHUNK_16: ${{ secrets.AE_SDK_MAC_16 }}
      AE_SDK_CHUNK_17: ${{ secrets.AE_SDK_MAC_17 }}
      AE_SDK_CHUNK_18: ${{ secrets.AE_SDK_MAC_18 }}
      AE_SDK_CHUNK_19: ${{ secrets.AE_SDK_MAC_19 }}
      AE_SDK_CHUNK_20: ${{ secrets.AE_SDK_MAC_20 }}
      AE_SDK_CHUNK_21: ${{ secrets.AE_SDK_MAC_21 }}
      AE_SDK_CHUNK_22: ${{ secrets.AE_SDK_MAC_22 }}
      AE_SDK_CHUNK_23: ${{ secrets.AE_SDK_MAC_23 }}
      AE_SDK_MANIFEST: ${{ secrets.AE_SDK_MAC_MANIFEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore private Adobe SDK (encrypted Actions secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions_sdk_private.py restore --destination "$RUNNER_TEMP/private-sdk"
          test -f "$RUNNER_TEMP/private-sdk/Examples/Headers/AE_Effect.h"
          test -f "$RUNNER_TEMP/private-sdk/Examples/Util/AEFX_SuiteHelper.c"
          echo "AE_SDK_ROOT=$RUNNER_TEMP/private-sdk/Examples" >> "$GITHUB_ENV"
      - name: Configure universal macOS AE effect
        run: |
          cmake -S . -B build-macos-ae -G Ninja -DCMAKE_BUILD_TYPE=Release             -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"             -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0             -DAE_SDK_ROOT="$AE_SDK_ROOT"             -DFLARELENS_BUILD_AE=ON -DFLARELENS_ENABLE_CUDA=OFF
      - name: Compile FlareSimAE.plugin
        run: cmake --build build-macos-ae --target FlareLensAE --parallel 3
      - name: Check native bundle and architectures
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find build-macos-ae -name 'FlareSimAE.plugin' -type d -print -quit)"
          test -n "$plugin" || { echo "::error::No plugin bundle generated"; exit 1; }
          binary="$plugin/Contents/MacOS/FlareSimAE"
          test -f "$binary"
          file "$binary"
          lipo -verify_arch arm64 x86_64 "$binary"
          find "$plugin/Contents/Resources" -type f -name '*.rsrc' -print -quit | grep .
          codesign --force --deep --sign - "$plugin"
          ditto -c -k --keepParent "$plugin" "$RUNNER_TEMP/FlareSimAE_macOS_CPU_unverified.zip"
          echo "FLARE_MAC_ZIP=$RUNNER_TEMP/FlareSimAE_macOS_CPU_unverified.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: FlareSimAE-macOS-CPU-unverified
          path: ${{ env.FLARE_MAC_ZIP }}
          if-no-files-found: error
          retention-days: 14
